apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: wisecow-block-package-management
  namespace: default
spec:
  selector:
    matchLabels:
      kubearmor.io/container.name: wisecow-cont
  process:
    matchPaths:
      - path: /usr/bin/apt
      - path: /usr/bin/apt-get
  action: Block
